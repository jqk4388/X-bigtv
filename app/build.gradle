plugins {
    id "com.android.application"
}

def verNameProp = (findProperty("versionName") ?: "0.2.7").toString().trim()
def verCodeProp = (findProperty("versionCode") ?: "207").toString().trim()
if (verNameProp.isEmpty()) { verNameProp = "0.2.0" }
def verCodeValue = 207
try { if (!verCodeProp.isEmpty()) { verCodeValue = verCodeProp.toInteger() } } catch (Exception ignored) { }

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "io.github.xbigtv.tv"
    compileSdk 34

    defaultConfig {
        applicationId "io.github.xbigtv.tv"
        minSdk 21
        targetSdk 34
        versionCode verCodeValue
        versionName verNameProp

        // armeabi-v7a 电视盒子优先；APP 本体为纯 Java（播放器使用 Media3 + HLS），
        // 打包时不携带其它 ABI 的 .so，保证在 32 位 ARM 老盒子上可安装运行。
        ndk {
            abiFilters "armeabi-v7a"
        }

        buildConfigField "String", "X_BEARER", "\"AAAAAAAAAAAAAAAAAAAAANRILgAAAAAAnNwIzUejRCOuH5E6I8xnZz4puTs%3D1Zv7ttfk8LF81IUq16cHjhLTvJu4FA33AGWWjCpTnA\""
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}", "META-INF/DEPENDENCIES", "META-INF/versions/9/OSGI-INF/MANIFEST.MF"]
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.annotation:annotation:1.8.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.webkit:webkit:1.11.0"

    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.4.1"
    implementation "androidx.media3:media3-datasource-okhttp:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"

    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.zxing:core:3.5.3"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
